<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تماشای مستقیم P2P</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: Tahoma; padding-top: 30px; }
        video { width: 80%; max-width: 800px; border-radius: 8px; margin-top: 20px; }
        .box { background: #222; padding: 15px; display: inline-block; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>انتخاب فیلم از روی سیستم (میزبانی از کامپیوتر شما)</h3>
        <input type="file" id="fileInput" accept="video/*">
    </div>
    <br>
    <video id="videoPlayer" controls></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const fileInput = document.getElementById('fileInput');
        const video = document.getElementById('videoPlayer');
        
        let pc;
        let dataChannel;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // اگر میزبان بودید و فایل انتخاب کردید
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            video.src = URL.createObjectURL(file);
            
            // راه‌اندازی ارتباط P2P برای ارسال استریم ویدیو به گوشی
            startPeer(true);
            
            // ارسال فایل به صورت کلان (یا استریم ویدیو مدیا استریم)
            setTimeout(() => {
                const stream = video.captureStream();
                stream.getTracks().forEach(track => pc.addTrack(track, stream));
                pc.createOffer().then(offer => pc.setLocalDescription(offer))
                  .then(() => socket.emit('signal', { sdps: pc.localDescription }));
            }, 1000);
        });

        // اگر مهمان بودید (گوشی دوستتان)
        socket.on('signal', async (data) => {
            if (!pc) startPeer(false);
            if (data.sdps) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdps));
                if (data.sdps.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { sdps: pc.localDescription });
                }
            } else if (data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function startPeer(isHost) {
            pc = new RTCPeerConnection(config);
            
            pc.onicecandidate = (event) => {
                if (event.candidate) socket.emit('signal', { candidate: event.candidate });
            };

            if (!isHost) {
                pc.ontrack = (event) => {
                    video.srcObject = event.streams[0];
                };
            }

            // مدیریت دکمه‌های کنترل پخش دوطرفه (Play/Pause)
            if (isHost) {
                dataChannel = pc.createDataChannel("sync");
                setupDataChannel();
                video.onplay = () => dataChannel.readyState === 'open' && dataChannel.send(JSON.stringify({type: 'play', time: video.currentTime}));
                video.onpause = () => dataChannel.readyState === 'open' && dataChannel.send(JSON.stringify({type: 'pause', time: video.currentTime}));
            } else {
                pc.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    setupDataChannel();
                };
            }
        }

        let isRemoteTrigger = false;
        function setupDataChannel() {
            dataChannel.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                isRemoteTrigger = true;
                if (Math.abs(video.currentTime - msg.time) > 1) video.currentTime = msg.time;
                if (msg.type === 'play') video.play();
                if (msg.type === 'pause') video.pause();
                setTimeout(() => isRemoteTrigger = false, 300);
            };
        }
    </script>
</body>
</html>
