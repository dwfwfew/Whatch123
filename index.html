<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تماشای فیلم و چت دونفره همگام</title>
<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
<style>
    body { background: #111; color: #fff; text-align: center; font-family: Tahoma; padding: 20px; }
    .player-container { width: 80%; max-width: 800px; margin: 15px auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: #000; }
    #artplayer { width: 100%; height: 450px; }
    .box { background: #222; padding: 15px; border-radius: 8px; margin: 10px auto; max-width: 800px; text-align: right; }
    .box h3 { text-align: center; }
    #chatBox { height: 120px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: right; margin-bottom: 10px; font-size: 14px; }
    input[type="text"] { padding: 8px; border-radius: 5px; border: none; width: 70%; }
    input[type="file"] { padding: 8px; background: #333; color: #fff; border-radius: 5px; border: none; margin: 5px; cursor: pointer; }
    button { padding: 8px; border-radius: 5px; border: none; background: #4f46e5; color: #fff; cursor: pointer; margin: 2px; }
    .status { font-size: 13px; color: #9ca3af; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
    <div class="box">
        <h3>مرحله ۱: ارتباط با دوست</h3>
        <p id="myId" class="status">شناسه شما: در حال اتصال به سرور...</p>
        <div style="text-align: center;">
            <input type="text" id="peerIdInput" placeholder="شناسه دوستتان را اینجا وارد کنید">
            <button onclick="connectToPeer()">اتصال به دوست</button>
        </div>
        <p class="status" id="connStatus">هنوز متصل نشده‌اید.</p>
    </div>

    <div class="box">
        <h3>انتخاب فیلم و زیرنویس</h3>
        <div>
            <label>انتخاب فیلم (هر دو نفر باید یک فیلم را انتخاب کنند): </label>
            <input type="file" id="fileInput" accept="video/*">
        </div>
        <div style="margin-top: 8px;">
            <label>انتخاب زیرنویس (SRT): </label>
            <input type="file" id="subInput" accept=".srt,.vtt">
        </div>
        <p class="status" id="sourceStatus">لطفاً فایل ویدیو را انتخاب کنید تا زمان و کنترل‌ها فعال شوند.</p>
    </div>
    
    <div class="player-container">
        <div id="artplayer"></div>
    </div>

    <div class="box">
        <h3>چت آنلاین</h3>
        <div id="chatBox"></div>
        <div style="text-align: center;">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer(undefined, {
            host: '0.peerjs.com',
            port: 443,
            secure: true,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        });
        let conn = null;          
        let isRemoteTrigger = false;

        const myIdText = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const connStatus = document.getElementById('connStatus');
        const sourceStatus = document.getElementById('sourceStatus');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const subInput = document.getElementById('subInput');

        const art = new Artplayer({
            container: '#artplayer',
            url: '',
            volume: 0.7,
            isLive: false,
            muted: false,
            autoplay: false,
            pip: true,
            fullscreen: true,
            fullscreenWeb: true,
            setting: true,
            playbackRate: true,
            aspectRatio: true,
            subtitleOffset: true,
            lock: true,
            miniProgressBar: true,
        });

        art.on('ready', () => {
            art.video.setAttribute('playsinline', 'true');
            art.video.setAttribute('webkit-playsinline', 'true');
        });

        // کنترل دوطرفه کامل روی تایم‌لاین و وضعیت پخش
        art.on('play', () => {
            if (isRemoteTrigger) return;
            sendAction('play', art.currentTime);
        });

        art.on('pause', () => {
            if (isRemoteTrigger) return;
            sendAction('pause', art.currentTime);
        });

        art.on('seek', (currentTime) => {
            if (isRemoteTrigger) return;
            // جلوگیری از اختلاف زمانی جزئی (اختلاف کمتر از 1 ثانیه نادیده گرفته شود تا لوپ نشود)
            sendAction('seek', currentTime);
        });

        peer.on('open', (id) => { 
            myIdText.innerText = "شناسه شما: " + id + " (این را برای دوستت بفرست)"; 
            myIdText.style.color = "#10b981";
        });
        
        peer.on('error', (err) => { 
            appendSystemMessage("خطای سرور: " + err.type); 
        });
        
        peer.on('connection', (connection) => {
            conn = connection;
            connStatus.innerText = "در حال برقراری اتصال با دوستت...";
            setupDataConnection();
        });

        function connectToPeer() {
            const id = peerIdInput.value.trim();
            if (!id) return;
            conn = peer.connect(id);
            connStatus.innerText = "در حال برقراری اتصال با دوستت...";
            setupDataConnection();
        }

        function setupDataConnection() {
            conn.on('open', () => {
                connStatus.innerText = "اتصال برقرار است ✔";
                appendSystemMessage("اتصال با موفقیت برقرار شد!");
            });
            conn.on('error', (err) => { connStatus.innerText = "⚠️ خطا: " + err.message; });
            conn.on('close', () => { connStatus.innerText = "❌ اتصال قطع شد."; });
            conn.on('data', (data) => {
                if (data.type === 'chat') { 
                    appendMessage("دوستت: " + data.text); 
                }
                else if (data.type === 'remote-control') {
                    applyRemoteAction(data.action, data.time);
                }
            });
        }

        function sendAction(action, time) {
            if (conn && conn.open) {
                conn.send({ type: 'remote-control', action, time });
            }
        }

        function applyRemoteAction(action, time) {
            isRemoteTrigger = true;
            if (action === 'play') {
                art.play();
            } else if (action === 'pause') {
                art.pause();
            } else if (action === 'seek' && typeof time === 'number') {
                // فقط اگر اختلاف زمانی بیشتر از 1.5 ثانیه بود پوزیشن را عوض کن تا پرش ایجاد نشود
                if (Math.abs(art.currentTime - time) > 1.5) {
                    art.currentTime = time;
                }
            }
            setTimeout(() => { isRemoteTrigger = false; }, 500);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !conn) return;
            conn.send({ type: 'chat', text: text });
            appendMessage("خودم: " + text);
            messageInput.value = '';
        }

        function appendMessage(text) { chatBox.innerHTML += `<div>${text}</div>`; chatBox.scrollTop = chatBox.scrollHeight; }
        function appendSystemMessage(text) { chatBox.innerHTML += `<div style="color:#10b981;">${text}</div>`; chatBox.scrollTop = chatBox.scrollHeight; }

        // بارگذاری فایل ویدیو به صورت محلی روی گوشی و کامپیوتر (باعث نمایان شدن تایم دقیق فیلم می‌شود)
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            art.switchUrl(fileURL);
            sourceStatus.innerText = "فایل بارگذاری شد: " + file.name + " (تایم و کنترل‌ها فعال شد)";
            appendSystemMessage("ویدیو با موفقیت روی پلیر بارگذاری شد.");
        });

        subInput.addEventListener('change', (e) => {
            const subFile = e.target.files[0];
            if (!subFile) return;
            const subURL = URL.createObjectURL(subFile);
            art.subtitle.switch(subURL, {
                name: subFile.name,
                type: subFile.name.endsWith('.vtt') ? 'vtt' : 'srt',
            });
            appendSystemMessage("زیرنویس اضافه شد: " + subFile.name);
        });
    </script>
</body>
</html>
