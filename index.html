<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تماشای فیلم و چت دونفره</title>
<style>
    body { background: #111; color: #fff; text-align: center; font-family: Tahoma; padding: 20px; }
    video { width: 80%; max-width: 800px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background:#000; margin-top: 15px; }
    .box { background: #222; padding: 15px; border-radius: 8px; margin: 10px auto; max-width: 800px; }
    #chatBox { height: 120px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: right; margin-bottom: 10px; font-size: 14px; }
    input[type="text"] { padding: 8px; border-radius: 5px; border: none; width: 70%; }
    input[type="file"] { padding: 8px; }
    button { padding: 8px; border-radius: 5px; border: none; background: #4f46e5; color: #fff; cursor: pointer; margin: 2px; }
    .status { font-size: 13px; color: #9ca3af; margin-top: 6px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; background:#333; }
    .badge.source { background:#4f46e5; }
    .play-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999; }
    
    .controls { display: flex; align-items: center; justify-content: center; gap: 10px; background: #222; padding: 12px 15px; border-radius: 8px; margin: 10px auto; max-width: 800px; width: 80%; box-sizing: border-box; flex-wrap: wrap; }
    #seekBar { flex: 1; min-width: 150px; cursor: pointer; }
    #timeLabel { font-size: 13px; color: #fff; font-family: monospace; }
</style>
</head>
<body>
    <div class="box">
        <h3>مرحله ۱: ارتباط با دوست</h3>
        <p id="myId">شناسه شما: در حال دریافت...</p>
        <input type="text" id="peerIdInput" placeholder="شناسه دوستتان را اینجا وارد کنید">
        <button onclick="connectToPeer()">اتصال به دوست</button>
        <p class="status" id="connStatus">هنوز متصل نشده‌اید.</p>
    </div>

    <div class="box">
        <h3>انتخاب فایل فیلم یا استریم صفحه</h3>
        <input type="file" id="fileInput" accept="video/*">
        <button onclick="startScreenShare()" style="background:#10b981; margin-top:10px;">📺 اشتراک‌گذاری تب (با صدا)</button>
        <p class="status" id="sourceStatus"></p>
    </div>

    <p class="status" id="videoConnStatus"></p>
    
    <video id="videoPlayer" controls playsinline autoplay></video>
    
    <div class="controls">
        <button onclick="remoteAction('play')">▶ پخش</button>
        <button onclick="remoteAction('pause')">⏸ توقف</button>
        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
        <span id="timeLabel" class="status">00:00 / 00:00</span>
        <button onclick="toggleMute()" id="muteBtn">🔇 صدا</button>
    </div>

    <div id="playOverlay" class="play-overlay" style="display:none;" onclick="forcePlay()">
        ▶️ برای شروع پخش کلیک کن
    </div>

    <div class="box">
        <h3>چت آنلاین</h3>
        <div id="chatBox"></div>
        <input type="text" id="messageInput" placeholder="پیام خود را بنویسید...">
        <button onclick="sendMessage()">لغو</button>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer(undefined, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        });
        let conn = null;          
        let isSource = false;     
        let isRemoteTrigger = false;
        let localStream = null;
        let seekDragging = false;
        let remoteDuration = 0;

        const myIdText = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const connStatus = document.getElementById('connStatus');
        const sourceStatus = document.getElementById('sourceStatus');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const video = document.getElementById('videoPlayer');
        const videoConnStatus = document.getElementById('videoConnStatus');
        const playOverlay = document.getElementById('playOverlay');
        const seekBar = document.getElementById('seekBar');
        const timeLabel = document.getElementById('timeLabel');
        const muteBtn = document.getElementById('muteBtn');

        peer.on('open', (id) => { myIdText.innerText = "شناسه شما: " + id + " (این را برای دوستت بفرست)"; });
        peer.on('error', (err) => { appendSystemMessage("خطا: " + err.type); });
        
        peer.on('connection', (connection) => {
            conn = connection;
            connStatus.innerText = "در حال برقراری اتصال با دوستت...";
            setupDataConnection();
        });

        peer.on('call', (call) => {
            if (isSource && localStream) { call.answer(localStream); } else { call.answer(); }
            handleIncomingOrOutgoingCall(call, false);
        });

        function connectToPeer() {
            const id = peerIdInput.value.trim();
            if (!id) return;
            conn = peer.connect(id);
            connStatus.innerText = "در حال برقراری اتصال با دوستت...";
            setupDataConnection();
        }

        function setupDataConnection() {
            conn.on('open', () => {
                connStatus.innerText = "اتصال برقرار است ✔";
                appendSystemMessage("اتصال با موفقیت برقرار شد!");
                if (isSource && localStream) {
                    const call = peer.call(conn.peer, localStream);
                    handleIncomingOrOutgoingCall(call, true, localStream);
                }
            });
            conn.on('error', (err) => { connStatus.innerText = "⚠️ خطا: " + err.message; });
            conn.on('close', () => { connStatus.innerText = "❌ اتصال قطع شد."; });
            conn.on('data', (data) => {
                if (data.type === 'chat') { 
                    appendMessage("دوستت: " + data.text); 
                }
                else if (data.type === 'remote-control') {
                    applyLocalAction(data.action, data.time);
                }
                else if (data.type === 'sync-state') {
                    if (!isSource) {
                        remoteDuration = data.duration;
                        updateTimeLabelFromRemote(data.time, data.duration);
                    }
                }
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !conn) return;
            conn.send({ type: 'chat', text: text });
            appendMessage("خودم: " + text);
            messageInput.value = '';
        }

        function appendMessage(text) { chatBox.innerHTML += `<div>${text}</div>`; chatBox.scrollTop = chatBox.scrollHeight; }
        function appendSystemMessage(text) { chatBox.innerHTML += `<div style="color:#10b981;">${text}</div>`; chatBox.scrollTop = chatBox.scrollHeight; }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            isSource = true;
            video.srcObject = null;
            video.src = URL.createObjectURL(file);
            video.muted = false;
            attemptPlay();
            
            updateSourceUI();
            sourceStatus.innerText = "در حال پخش: " + file.name;

            video.onloadeddata = () => {
                try {
                    const videoStream = video.captureStream ? video.captureStream(30) : video.mozCaptureStream(30);
                    if (videoStream) { localStream = videoStream; }

                    if (localStream && (peerIdInput.value.trim() || (conn && conn.open))) {
                        const targetId = conn ? conn.peer : peerIdInput.value.trim();
                        const call = peer.call(targetId, localStream);
                        handleIncomingOrOutgoingCall(call, true, localStream);
                    }
                } catch (ex) { console.error("CaptureStream error:", ex); }
            };
        });

        async function startScreenShare() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { frameRate: 30 }, 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                isSource = true;
                localStream = stream;
                video.srcObject = stream;
                video.src = '';
                video.muted = true;
                attemptPlay();
                
                updateSourceUI();
                sourceStatus.innerText = "پخش: استریم صفحه نمایش";

                if (peerIdInput.value.trim() || (conn && conn.open)) {
                    const targetId = conn ? conn.peer : peerIdInput.value.trim();
                    const call = peer.call(targetId, localStream);
                    handleIncomingOrOutgoingCall(call, true, localStream);
                }
            } catch (err) {
                appendSystemMessage("خطا در اشتراک صفحه: " + err.message);
            }
        }

        function handleIncomingOrOutgoingCall(call, isOutgoing, outgoingStream) {
            videoConnStatus.innerText = "🟡 در حال برقراری اتصال ویدیویی...";

            call.on('stream', (remoteStream) => {
                if (isSource) return; 
                isSource = false;
                video.srcObject = remoteStream;
                video.src = '';
                video.muted = false;
                attemptPlay();
                updateSourceUI();
                appendSystemMessage("فیلم الان برای شما پخش میشه 🎬");
            });

            call.on('error', (err) => { videoConnStatus.innerText = "🔴 خطا در تماس ویدیویی: " + err; });
            call.on('close', () => { videoConnStatus.innerText = "🔴 اتصال ویدیویی قطع شد."; });

            const pc = call.peerConnection;
            if (pc) {
                pc.oniceconnectionstatechange = () => {
                    const state = pc.iceConnectionState;
                    if (state === 'connected' || state === 'completed') videoConnStatus.innerText = "🟢 اتصال ویدیویی برقرار است.";
                    else if (state === 'failed' || state === 'disconnected') videoConnStatus.innerText = "🔴 اتصال ویدیویی ضعیف است یا قطع شد.";
                };
            }
        }

        function remoteAction(action) {
            if (isSource) {
                applyLocalAction(action, video.currentTime);
                if (conn && conn.open) conn.send({ type: 'remote-control', action, time: video.currentTime });
            } else {
                if (conn && conn.open) conn.send({ type: 'remote-control', action, time: video.currentTime });
            }
        }

        function applyLocalAction(action, time) {
            isRemoteTrigger = true;
            if (action === 'play') attemptPlay();
            if (action === 'pause') video.pause();
            if (action === 'seek' && typeof time === 'number') {
                if (isSource) video.currentTime = time;
            }
            setTimeout(() => isRemoteTrigger = false, 500); 
        }

        video.addEventListener('timeupdate', () => {
            if (isSource) {
                if (!seekDragging) updateLocalTimeLabel();
                if (conn && conn.open) {
                    conn.send({ type: 'sync-state', time: video.currentTime, duration: video.duration || 0 });
                }
            }
        });

        seekBar.addEventListener('input', () => { seekDragging = true; });
        seekBar.addEventListener('change', () => {
            seekDragging = false;
            let targetTime = 0;
            
            if (isSource) {
                targetTime = (seekBar.value / 100) * (video.duration || 0);
                video.currentTime = targetTime;
                if (conn && conn.open) conn.send({ type: 'remote-control', action: 'seek', time: targetTime });
            } else {
                targetTime = (seekBar.value / 100) * remoteDuration;
                if (conn && conn.open) conn.send({ type: 'remote-control', action: 'seek', time: targetTime });
            }
        });

        function updateLocalTimeLabel() {
            const cur = video.currentTime || 0, dur = video.duration || 0;
            if (dur > 0 && !seekDragging) seekBar.value = (cur / dur) * 100;
            timeLabel.innerText = fmt(cur) + " / " + fmt(dur);
        }

        function updateTimeLabelFromRemote(time, duration) {
            if (!seekDragging) seekBar.value = duration > 0 ? (time / duration) * 100 : 0;
            timeLabel.innerText = fmt(time) + " / " + fmt(duration);
        }

        function fmt(sec) {
            if (!isFinite(sec) || isNaN(sec)) return "00:00";
            return Math.floor(sec / 60).toString().padStart(2, '0') + ":" + Math.floor(sec % 60).toString().padStart(2, '0');
        }

        function toggleMute() {
            video.muted = !video.muted;
            muteBtn.innerText = video.muted ? '🔊 صدا' : '🔇 صدا';
        }

        function updateSourceUI() {
            sourceStatus.innerHTML = isSource ? '<span class="badge source">صاحب فیلم تو هستی</span>' : '<span class="badge">داری استریم دوستت رو می‌بینی</span>';
        }

        function attemptPlay() {
            const p = video.play();
            if (p && p.catch) p.then(() => { playOverlay.style.display = 'none'; }).catch(() => { playOverlay.style.display = 'flex'; });
        }
        function forcePlay() {
            video.play().then(() => { playOverlay.style.display = 'none'; }).catch(() => { playOverlay.style.display = 'flex'; });
        }
    </script>
</body>
</html>
