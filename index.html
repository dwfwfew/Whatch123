<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سینمای دونفره آنلاین (Watch Party)</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0f19; color: #f3f4f6; text-align: center; font-family: Tahoma, sans-serif; margin: 0; padding: 20px; }
        .wrapper { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1f2937; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        video { width: 100%; max-height: 450px; background: #000; border-radius: 8px; outline: none; }
        #chatBox { height: 120px; overflow-y: auto; background: #111827; padding: 10px; border-radius: 6px; text-align: right; margin-bottom: 10px; font-size: 14px; border: 1px solid #374151; }
        input, button { padding: 10px; border-radius: 6px; border: none; font-family: Tahoma; font-size: 14px; }
        input[type="text"] { width: 60%; background: #374151; color: #fff; }
        button { background: #6366f1; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #4f46e5; }
        .btn-green { background: #10b981; }
        .btn-green:hover { background: #059669; }
        .row { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .status-badge { font-size: 13px; color: #34d399; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>اتاق اختصاصی تماشای فیلم</h2>

        <!-- پنل اتصال -->
        <div class="card">
            <h3>تنظیمات اتصال</h3>
            <p id="myId" class="status-badge">شناسه اتاق شما: در حال دریافت...</p>
            <div class="row">
                <input type="text" id="peerIdInput" placeholder="شناسه دوستتان را اینجا وارد کنید...">
                <button onclick="connectToPeer()">اتصال به دوست</button>
            </div>
        </div>

        <!-- پنل مدیا پلیر و فایل -->
        <div class="card">
            <div class="row" style="margin-bottom: 10px; justify-content: space-between;">
                <input type="file" id="fileInput" accept="video/*" style="background:#374151; color:#fff; padding:6px;">
                <div>
                    <button onclick="skipTime(-5)">⏪ ۵ ثانیه عقب</button>
                    <button onclick="skipTime(5)">۵ ثانیه جلو ⏩</button>
                </div>
            </div>
            <video id="videoPlayer" controls></video>
        </div>

        <!-- پنل چت -->
        <div class="card">
            <h3>گفتگوی آنلاین</h3>
            <div id="chatBox"></div>
            <div class="row">
                <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">ارسال</button>
            </div>
        </div>
    </div>

    <!-- کتابخانه PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer();
        let conn;
        let isRemoteAction = false;

        const myIdText = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const video = document.getElementById('videoPlayer');

        peer.on('open', (id) => {
            myIdText.innerText = "شناسه اتاق شما: " + id;
        });

        // دریافت ارتباط از سمت نفر دوم
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
            appendSystemMessage("دوست شما به اتاق متصل شد!");
        });

        function connectToPeer() {
            const id = peerIdInput.value.trim();
            if (!id) return;
            appendSystemMessage("در حال اتصال به دوست...");
            conn = peer.connect(id);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                appendSystemMessage("ارتباط امن P2P برقرار شد!");
            });

            conn.on('data', (data) => {
                if (data.type === 'chat') {
                    appendMessage("دوستت: " + data.text);
                } else if (data.type === 'sync') {
                    isRemoteAction = true;
                    // همگام‌سازی زمان و وضعیت پِلی/پاز
                    if (Math.abs(video.currentTime - data.time) > 0.6) {
                        video.currentTime = data.time;
                    }
                    if (data.action === 'play') {
                        video.play().catch(() => {});
                    } else if (data.action === 'pause') {
                        video.pause();
                    }
                    setTimeout(() => { isRemoteAction = false; }, 300);
                }
            });

            conn.on('close', () => {
                appendSystemMessage("ارتباط قطع شد.");
            });
        }

        // بارگذاری ویدیو روی مرورگر هر دو کاربر
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                video.src = URL.createObjectURL(file);
                appendSystemMessage("فایل ویدیویی روی پلیر بارگذاری شد.");
            }
        });

        // مدیریت ارسال دستورات هماهنگی فیلم
        function sendSync(action) {
            if (!conn || conn.open !== true) return;
            conn.send({
                type: 'sync',
                action: action,
                time: video.currentTime
            });
        }

        function skipTime(seconds) {
            video.currentTime += seconds;
            sendSync(video.paused ? 'pause' : 'play');
        }

        video.onplay = () => {
            if (isRemoteAction) return;
            sendSync('play');
        };

        video.onpause = () => {
            if (isRemoteAction) return;
            sendSync('pause');
        };

        video.onseeked = () => {
            if (isRemoteAction) return;
            sendSync(video.paused ? 'pause' : 'play');
        };

        // سیستم چت
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !conn) return;
            conn.send({ type: 'chat', text: text });
            appendMessage("خودم: " + text);
            messageInput.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(text) {
            chatBox.innerHTML += `<div>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            chatBox.innerHTML += `<div style="color: #34d399; font-weight: bold;">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
