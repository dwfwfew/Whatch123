<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تماشای فیلم و چت دونفره</title>
<style>
    body { background: #111; color: #fff; text-align: center; font-family: Tahoma; padding: 20px; }
    video { width: 80%; max-width: 800px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background:#000; margin-top: 15px; }
    .box { background: #222; padding: 15px; border-radius: 8px; margin: 10px auto; max-width: 800px; }
    #chatBox { height: 120px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: right; margin-bottom: 10px; font-size: 14px; }
    input, button { padding: 8px; border-radius: 5px; border: none; }
    input[type="text"] { width: 70%; }
    button { background: #4f46e5; color: #fff; cursor: pointer; margin: 2px; }
    .status { font-size: 13px; color: #9ca3af; margin-top: 6px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; background:#333; }
    .badge.source { background:#4f46e5; }
    .play-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.75); color: #fff; font-size: 22px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; z-index: 999;
    }
</style>
</head>
<body>
    <div class="box">
        <h3>مرحله ۱: ارتباط با دوست</h3>
        <p id="myId">شناسه شما: در حال دریافت...</p>
        <input type="text" id="peerIdInput" placeholder="شناسه دوستتان را اینجا وارد کنید">
        <button onclick="connectToPeer()">اتصال به دوست</button>
        <p class="status" id="connStatus">هنوز متصل نشده‌اید.</p>
    </div>

    <div class="box">
        <h3>انتخاب فایل فیلم یا استریم صفحه</h3>
        <input type="file" id="fileInput" accept="video/*">
        <button onclick="startScreenShare()" style="background:#10b981; margin-top:10px;">📺 اشتراک‌گذاری تب (با صدا)</button>
        <p class="status" id="sourceStatus"></p>
    </div>

    <p class="status" id="videoConnStatus"></p>
    
    <!-- پلیر با کنترل‌های استاندارد مرورگر (دکمه‌های اختصاصی حذف شدند) -->
    <video id="videoPlayer" controls playsinline autoplay></video>
    
    <div id="playOverlay" class="play-overlay" style="display:none;" onclick="forcePlay()">
        ▶️ برای شروع پخش کلیک کن (رفع محدودیت مرورگر)
    </div>

    <div class="box" style="margin-top: 15px;">
        <h3>چت آنلاین</h3>
        <div id="chatBox"></div>
        <input type="text" id="messageInput" placeholder="پیام خود را بنویسید...">
        <button onclick="sendMessage()">ارسال</button>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer(undefined, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        });
        let conn = null;          
        let mediaCall = null;     
        let isSource = false;     
        let isRemoteTrigger = false;
        let localStream = null;

        const myIdText = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const connStatus = document.getElementById('connStatus');
        const sourceStatus = document.getElementById('sourceStatus');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const video = document.getElementById('videoPlayer');
        const videoConnStatus = document.getElementById('videoConnStatus');
        const playOverlay = document.getElementById('playOverlay');

        peer.on('open', (id) => { myIdText.innerText = "شناسه شما: " + id + " (این را برای دوستت بفرست)"; });
        peer.on('error', (err) => { appendSystemMessage("خطا: " + err.type); });
        
        peer.on('connection', (connection) => {
            conn = connection;
            connStatus.innerText = "در حال برقراری اتصال با دوستت...";
            setupDataConnection();
        });

        peer.on('call', (call) => {
            if (isSource && localStream) { call.answer(localStream); } else { call.answer(); }
            handleIncomingOrOutgoingCall(call, false);
        });

        function connectToPeer() {
            const id = peerIdInput.value.trim();
            if (!id) return;
            conn = peer.connect(id);
            connStatus.innerText = "در حال برقراری اتصال با دوستت...";
            setupDataConnection();
        }

        function setupDataConnection() {
            conn.on('open', () => {
                connStatus.innerText = "اتصال برقرار است ✔";
                appendSystemMessage("اتصال با موفقیت برقرار شد!");
                if (isSource && localStream) {
                    const call = peer.call(conn.peer, localStream);
                    handleIncomingOrOutgoingCall(call, true, localStream);
                }
            });
            conn.on('error', (err) => { connStatus.innerText = "⚠️ خطا: " + err.message; });
            conn.on('close', () => { connStatus.innerText = "❌ اتصال قطع شد."; });
            conn.on('data', (data) => {
                if (data.type === 'chat') { appendMessage("دوستت: " + data.text); }
                else if (data.type === 'remote-control') {
                    applyLocalAction(data.action, data.time);
                }
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !conn) return;
            conn.send({ type: 'chat', text: text });
            appendMessage("خودم: " + text);
            messageInput.value = '';
        }

        function appendMessage(text) { chatBox.innerHTML += `<div>${text}</div>`; chatBox.scrollTop = chatBox.scrollHeight; }
        function appendSystemMessage(text) { chatBox.innerHTML += `<div style="color:#10b981;">${text}</div>`; chatBox.scrollTop = chatBox.scrollHeight; }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            isSource = true;
            video.srcObject = null;
            video.src = URL.createObjectURL(file);
            video.muted = false;
            attemptPlay();
            
            updateSourceUI();
            sourceStatus.innerText = "در حال پخش: " + file.name;

            video.onloadeddata = () => {
                try {
                    if (video.captureStream) localStream = video.captureStream(30);
                    else if (video.mozCaptureStream) localStream = video.mozCaptureStream(30);

                    if (localStream && (peerIdInput.value.trim() || (conn && conn.open))) {
                        const targetId = conn ? conn.peer : peerIdInput.value.trim();
                        const call = peer.call(targetId, localStream);
                        handleIncomingOrOutgoingCall(call, true, localStream);
                    }
                } catch (ex) { console.error("CaptureStream error:", ex); }
            };
            appendSystemMessage("فایل لود شد. در حال آماده‌سازی تصویر...");
        });

        async function startScreenShare() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                isSource = true;
                localStream = stream;
                video.srcObject = stream;
                video.src = '';
                video.muted = true;
                attemptPlay();
                
                updateSourceUI();
                sourceStatus.innerText = "پخش: استریم صفحه نمایش";
                appendSystemMessage("استریم تب شروع شد. (دقت کن تیک Share Audio را زده باشی)");

                if (peerIdInput.value.trim() || (conn && conn.open)) {
                    const targetId = conn ? conn.peer : peerIdInput.value.trim();
                    const call = peer.call(targetId, localStream);
                    handleIncomingOrOutgoingCall(call, true, localStream);
                }
            } catch (err) {
                appendSystemMessage("خطا در اشتراک صفحه: " + err.message);
            }
        }

        function handleIncomingOrOutgoingCall(call, isOutgoing, outgoingStream) {
            mediaCall = call;
            videoConnStatus.innerText = "🟡 در حال برقراری اتصال ویدیویی...";

            call.on('stream', (remoteStream) => {
                if (isSource) return; 
                isSource = false;
                video.srcObject = remoteStream;
                video.src = '';
                video.muted = true; // دور زدن محدودیت‌های موبایل
                attemptPlay();
                updateSourceUI();
                appendSystemMessage("فیلم الان برات پخش میشه 🎬 (از روی پلیر دکمه بلندگو را روشن کن)");
            });

            call.on('error', (err) => { videoConnStatus.innerText = "🔴 خطا در تماس ویدیویی: " + err; });
            call.on('close', () => { videoConnStatus.innerText = "🔴 اتصال ویدیویی قطع شد."; });

            const pc = call.peerConnection;
            if (pc) {
                pc.oniceconnectionstatechange = () => {
                    const state = pc.iceConnectionState;
                    if (state === 'connected' || state === 'completed') videoConnStatus.innerText = "🟢 اتصال ویدیویی برقرار است.";
                    else if (state === 'failed' || state === 'disconnected') videoConnStatus.innerText = "🔴 اتصال ویدیویی ضعیف است یا قطع شد.";
                };
            }
        }

        // --- هماهنگ‌سازی رویدادهای پلیر استاندارد ---
        
        video.addEventListener('play', () => {
            if (!isRemoteTrigger && conn && conn.open) {
                conn.send({ type: 'remote-control', action: 'play' });
            }
        });

        video.addEventListener('pause', () => {
            if (!isRemoteTrigger && conn && conn.open) {
                conn.send({ type: 'remote-control', action: 'pause' });
            }
        });

        video.addEventListener('seeked', () => {
            if (!isRemoteTrigger && conn && conn.open && isSource) {
                conn.send({ type: 'remote-control', action: 'seek', time: video.currentTime });
            }
        });

        function applyLocalAction(action, time) {
            isRemoteTrigger = true;
            if (action === 'play') attemptPlay();
            if (action === 'pause') video.pause();
            if (action === 'seek' && isSource && typeof time === 'number') {
                video.currentTime = time;
            }
            setTimeout(() => isRemoteTrigger = false, 500); // جلوگیری از لوپ بی‌نهایت بین دو پلیر
        }

        function updateSourceUI() {
            sourceStatus.innerHTML = isSource ? '<span class="badge source">صاحب فیلم تو هستی</span>' : '<span class="badge">داری استریم دوستت رو می‌بینی</span>';
        }

        function attemptPlay() {
            const p = video.play();
            if (p && p.catch) p.then(() => { playOverlay.style.display = 'none'; }).catch(() => { playOverlay.style.display = 'flex'; });
        }

        function forcePlay() {
            video.play().then(() => { playOverlay.style.display = 'none'; }).catch(() => { playOverlay.style.display = 'flex'; });
        }
    </script>
</body>
</html>
