<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اتاق تماشای آنلاین (شبیه Kosmi و Watch2Gether)</title>
    <style>
        body { background: #0f172a; color: #f8fafc; text-align: center; font-family: Tahoma; padding: 20px; margin: 0; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 15px; max-width: 900px; margin: 0 auto; }
        .box { background: #1e293b; padding: 15px; border-radius: 12px; width: 100%; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        video { width: 100%; max-height: 450px; background: #000; border-radius: 8px; }
        #chatBox { height: 140px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 6px; text-align: right; margin-bottom: 10px; font-size: 14px; border: 1px solid #334155; }
        input, button { padding: 10px; border-radius: 6px; border: none; font-family: Tahoma; font-size: 14px; }
        input[type="text"] { width: 60%; background: #334155; color: #fff; }
        button { background: #6366f1; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #4f46e5; }
        .flex-row { display: flex; gap: 10px; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>اتاق اختصاصی تماشای گروهی</h2>

        <!-- بخش اتصال -->
        <div class="box">
            <h3>تنظیمات اتصال</h3>
            <p id="myId">شناسه اتاق شما: در حال دریافت...</p>
            <div class="flex-row">
                <input type="text" id="peerIdInput" placeholder="شناسه میزبان را اینجا وارد کنید...">
                <button onclick="connectToHost()">ورود به اتاق</button>
            </div>
        </div>

        <!-- بخش ویدیو و استریم -->
        <div class="box">
            <h3>صفحه پخش</h3>
            <div class="flex-row" style="margin-bottom: 10px;">
                <button onclick="startSharing()" style="background: #10b981;">شروع پخش فیلم (مخصوص میزبان)</button>
            </div>
            <!-- ویدیو برای نمایش استریم میزبان به مهمان یا پخش محلی میزبان -->
            <video id="remoteVideo" autoplay controls></video>
        </div>

        <!-- بخش چت -->
        <div class="box">
            <h3>گفتگوی آنلاین</h3>
            <div id="chatBox"></div>
            <div class="flex-row">
                <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">ارسال</button>
            </div>
        </div>
    </div>

    <!-- کتابخانه PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer();
        let currentCall;
        let conn;
        
        const myIdText = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const remoteVideo = document.getElementById('remoteVideo');

        peer.on('open', (id) => {
            myIdText.innerText = "شناسه اتاق شما: " + id;
        });

        // دریافت تماس ویدیویی یا متنی از سمت میزبان/مهمان
        peer.on('call', (call) => {
            // وقتی مهمان تماس را دریافت می‌کند، استریم ویدیو را به او نشان می‌دهیم
            navigator.mediaDevices.getUserMedia({ video: false, audio: true }).then(() => {
                call.answer(); // بدون ارسال دوربین خودمان، فقط دریافت‌کننده می‌شویم یا استریم صوتی خالی
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    appendSystemMessage("تصویر و صدای میزبان متصل شد!");
                });
            }).catch(() => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    appendSystemMessage("تصویر و صدای میزبان متصل شد!");
                });
            });
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupDataConnection();
            appendSystemMessage("یک کاربر وارد اتاق شد!");
        });

        function connectToHost() {
            const hostId = peerIdInput.value.trim();
            if (!hostId) return;
            
            // اتصال داده برای چت
            conn = peer.connect(hostId);
            setupDataConnection();

            // برقراری تماس ویدیویی برای دریافت استریم از میزبان
            const call = peer.call(hostId, new MediaStream());
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                appendSystemMessage("به استریم میزبان متصل شدید!");
            });
            
            appendSystemMessage("درخواست اتصال به میزبان ارسال شد...");
        }

        function setupDataConnection() {
            conn.on('data', (data) => {
                if (data.type === 'chat') {
                    appendMessage("کاربر مقابل: " + data.text);
                }
            });
        }

        // قابلیت کلیدی: میزبان صفحه نمایش یا تبِ حاوی فیلم را با صدا به اشتراک می‌گذارد
        async function startSharing() {
            try {
                // درخواست ضبط صفحه نمایش به همراه صدای سیستم/تب
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { cursor: "always" }, 
                    audio: true 
                });
                
                remoteVideo.srcObject = stream;
                remoteVideo.muted = true; // میزبان صدای خودش را نشنود تا اکو نشود
                appendSystemMessage("پخش زنده صفحه نمایش شما آغاز شد.");

                // ارسال این استریم به تمام کسانی که به این Peer متصل می‌شوند
                peer.on('call', (incomingCall) => {
                    incomingCall.answer(stream);
                });

                // اگر کسی از قبل وصل شده بود، استریم را برایش بفرست
                if (conn && conn.peer) {
                    peer.call(conn.peer, stream);
                }

                stream.getVideoTracks()[0].onended = () => {
                    appendSystemMessage("پخش زنده متوقف شد.");
                };
            } catch (err) {
                alert("امکان اشتراک‌گذاری صفحه/ویدیو وجود ندارد یا لغو شد: " + err.message);
            }
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !conn) return;
            conn.send({ type: 'chat', text: text });
            appendMessage("خودم: " + text);
            messageInput.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(text) {
            chatBox.innerHTML += `<div>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            chatBox.innerHTML += `<div style="color: #34d399; font-weight: bold;">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
