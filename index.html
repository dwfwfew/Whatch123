<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تماشای فیلم و چت دونفره</title>
<style>
    body { background: #111; color: #fff; text-align: center; font-family: Tahoma; padding: 20px; }
    video { width: 80%; max-width: 800px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background:#000; }
    .box { background: #222; padding: 15px; border-radius: 8px; margin: 10px auto; max-width: 800px; }
    #chatBox { height: 120px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: right; margin-bottom: 10px; font-size: 14px; }
    input, button { padding: 8px; border-radius: 5px; border: none; }
    input[type="text"] { width: 70%; }
    button { background: #4f46e5; color: #fff; cursor: pointer; margin: 2px; }
    button:disabled { background: #444; cursor: not-allowed; }
    .controls { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:10px; flex-wrap: wrap; }
    #seekBar { flex:1; min-width:200px; }
    .status { font-size: 13px; color: #9ca3af; margin-top: 6px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; background:#333; }
    .badge.source { background:#4f46e5; }
    .play-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.75); color: #fff; font-size: 22px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; z-index: 999;
    }
</style>
</head>
<body>
    <div class="box">
        <h3>مرحله ۱: ارتباط با دوست</h3>
        <p id="myId">شناسه شما: در حال دریافت...</p>
        <input type="text" id="peerIdInput" placeholder="شناسه دوستتان را اینجا وارد کنید">
        <button onclick="connectToPeer()">اتصال به دوست</button>
        <p class="status" id="connStatus">هنوز متصل نشده‌اید.</p>
    </div>

    <div class="box">
        <h3>انتخاب فایل فیلم</h3>
        <p class="status">هرکس فایل انتخاب کند، خودش «صاحب فیلم» می‌شود و پخشش برای طرف مقابل زنده استریم می‌شود.</p>
        <input type="file" id="fileInput" accept="video/*">
        <p class="status" id="sourceStatus"></p>
    </div>

    <p class="status" id="videoConnStatus"></p>
    <p class="status" id="debugStatus" style="font-family:monospace; direction:ltr; text-align:center;"></p>
    <video id="videoPlayer" playsinline autoplay></video>
    <div id="playOverlay" class="play-overlay" style="display:none;" onclick="forcePlay()">
        ▶️ برای شروع پخش کلیک کن
    </div>

    <div class="controls">
        <button id="playBtn" onclick="remoteAction('play')">▶ پخش</button>
        <button id="pauseBtn" onclick="remoteAction('pause')">⏸ توقف</button>
        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
        <span id="timeLabel" class="status">۰۰:۰۰ / ۰۰:۰۰</span>
        <button id="muteBtn" onclick="toggleMute()">🔇 صدا</button>
        <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ تمام‌صفحه</button>
    </div>

    <div class="box">
        <h3>چت آنلاین</h3>
        <div id="chatBox"></div>
        <input type="text" id="messageInput" placeholder="پیام خود را بنویسید...">
        <button onclick="sendMessage()">ارسال</button>
    </div>

    <!-- کتابخانه PeerJS برای ارتباط P2P بدون سرور اختصاصی -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer(undefined, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    {
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            }
        });
        let conn = null;          
        let mediaCall = null;     
        let isSource = false;     
        let isRemoteTrigger = false;
        let seekDragging = false;
        let localStream = null;

        const myIdText = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const connStatus = document.getElementById('connStatus');
        const sourceStatus = document.getElementById('sourceStatus');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const video = document.getElementById('videoPlayer');
        const videoConnStatus = document.getElementById('videoConnStatus');
        const seekBar = document.getElementById('seekBar');
        const timeLabel = document.getElementById('timeLabel');

        peer.on('open', (id) => {
            myIdText.innerText = "شناسه شما: " + id + " (این را برای دوستت بفرست)";
        });

        peer.on('error', (err) => {
            appendSystemMessage("خطا: " + err.type);
        });

        peer.on('connection', (connection) => {
            conn = connection;
            connStatus.innerText = "در حال برقراری اتصال با دوستت...";
            setupDataConnection();
        });

        peer.on('call', (call) => {
            // اگر خودمان فرستنده هستیم و تماس ورودی میگیریم، استریم محلی را پاس میدهیم، در غیر این صورت خالی جواب میدهیم
            if (isSource && localStream) {
                call.answer(localStream);
            } else {
                call.answer(); 
            }
            handleIncomingOrOutgoingCall(call, false);
        });

        function connectToPeer() {
            const id = peerIdInput.value.trim();
            if (!id) return;
            conn = peer.connect(id);
            connStatus.innerText = "در حال برقراری اتصال با دوستت...";
            setupDataConnection();
        }

        function setupDataConnection() {
            const connectTimeout = setTimeout(() => {
                if (!conn || !conn.open) {
                    connStatus.innerText = "⚠️ اتصال برقرار نشد. صفحه رو رفرش کنید.";
                }
            }, 10000);

            conn.on('open', () => {
                clearTimeout(connectTimeout);
                connStatus.innerText = "اتصال برقرار است ✔";
                appendSystemMessage("اتصال با موفقیت برقرار شد!");
                
                // اگر از قبل فیلم را انتخاب کرده بودیم و حالا به دوست وصل شدیم، تماس را برقرار کن
                if (isSource && localStream) {
                    const targetId = conn.peer;
                    const call = peer.call(targetId, localStream);
                    handleIncomingOrOutgoingCall(call, true, localStream);
                }
            });

            conn.on('error', (err) => {
                connStatus.innerText = "⚠️ خطا در اتصال: " + (err.type || err.message || err);
            });

            conn.on('close', () => {
                connStatus.innerText = "❌ اتصال قطع شد.";
            });
            conn.on('data', (data) => {
                if (data.type === 'chat') {
                    appendMessage("دوستت: " + data.text);
                } else if (data.type === 'remote-control') {
                    if (!isSource) return;
                    applyLocalAction(data.action, data.time);
                    broadcastSyncState();
                } else if (data.type === 'sync-state') {
                    if (isSource) return;
                    updateTimeLabelFromRemote(data.time, data.duration);
                }
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !conn) return;
            conn.send({ type: 'chat', text: text });
            appendMessage("خودم: " + text);
            messageInput.value = '';
        }

        function appendMessage(text) {
            chatBox.innerHTML += `<div>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            chatBox.innerHTML += `<div style="color:#10b981;">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            isSource = true;
            video.srcObject = null;
            video.src = URL.createObjectURL(file);
            video.muted = false;
            updateMuteBtn();
            
            try {
                await video.play();
            } catch (err) {
                playOverlay.style.display = 'flex';
            }

            updateSourceUI();
            sourceStatus.innerText = "در حال پخش: " + file.name;

            // صبر میکنیم تا ویدیو حتماً ابعاد و اطلاعاتش لود شود تا captureStream با موفقیت صدا و تصویر را بگیرد
            setTimeout(() => {
                try {
                    if (video.captureStream) {
                        localStream = video.captureStream();
                    } else if (video.mozCaptureStream) {
                        localStream = video.mozCaptureStream();
                    }

                    if (localStream && (peerIdInput.value.trim() || (conn && conn.open))) {
                        const targetId = conn ? conn.peer : peerIdInput.value.trim();
                        const call = peer.call(targetId, localStream);
                        handleIncomingOrOutgoingCall(call, true, localStream);
                    }
                } catch (ex) {
                    console.error("CaptureStream error:", ex);
                }
            }, 500);

            appendSystemMessage("فیلم انتخاب شد و شروع به استریم برای دوستت کرد.");
        });

        function handleIncomingOrOutgoingCall(call, isOutgoing, outgoingStream) {
            mediaCall = call;
            videoConnStatus.innerText = "🟡 در حال برقراری اتصال ویدیویی...";

            call.on('stream', (remoteStream) => {
                if (isSource) return; 
                isSource = false;
                video.srcObject = remoteStream;
                video.src = '';
                video.muted = true; // در موبایل برای اتومایگریشن اولیه بی‌صدا بهتر لود میشود
                updateMuteBtn();
                attemptPlay();
                updateSourceUI();
                appendSystemMessage("فیلم دوستت الان برات پخش میشه 🎬 (برای شنیدن صدا دکمه‌ی 🔇 را لمس کنید)");
            });

            call.on('error', (err) => {
                videoConnStatus.innerText = "🔴 خطا در تماس ویدیویی: " + err;
            });

            call.on('close', () => {
                videoConnStatus.innerText = "🔴 اتصال ویدیویی قطع شد.";
            });

            const pc = call.peerConnection;
            if (pc) {
                pc.oniceconnectionstatechange = () => {
                    const state = pc.iceConnectionState;
                    if (state === 'connected' || state === 'completed') {
                        videoConnStatus.innerText = "🟢 اتصال ویدیویی برقرار است.";
                    } else if (state === 'failed' || state === 'disconnected') {
                        videoConnStatus.innerText = "🔴 اتصال ویدیویی برقرار نشد. لطفاً صفحه را رفرش کنید.";
                        if (isOutgoing && state === 'failed' && outgoingStream) {
                            setTimeout(() => {
                                appendSystemMessage("تلاش مجدد برای اتصال ویدیویی...");
                                const retryCall = peer.call(call.peer, outgoingStream);
                                handleIncomingOrOutgoingCall(retryCall, true, outgoingStream);
                            }, 1500);
                        }
                    }
                };
            }
        }

        function remoteAction(action) {
            if (isSource) {
                applyLocalAction(action, video.currentTime);
                broadcastSyncState();
            } else {
                if (!conn) return;
                conn.send({ type: 'remote-control', action, time: video.currentTime });
            }
        }

        function applyLocalAction(action, time) {
            isRemoteTrigger = true;
            if (typeof time === 'number' && Math.abs(video.currentTime - time) > 1) {
                video.currentTime = time;
            }
            if (action === 'play') attemptPlay();
            if (action === 'pause') video.pause();
            if (action === 'seek') video.currentTime = time;
            setTimeout(() => isRemoteTrigger = false, 300);
        }

        function broadcastSyncState() {
            if (!conn) return;
            conn.send({ type: 'sync-state', time: video.currentTime, duration: video.duration || 0 });
        }

        video.addEventListener('play', () => { if (isSource && !isRemoteTrigger) broadcastSyncState(); });
        video.addEventListener('pause', () => { if (isSource && !isRemoteTrigger) broadcastSyncState(); });
        video.addEventListener('timeupdate', () => {
            if (!seekDragging) updateTimeLabel();
            if (isSource) broadcastSyncState();
        });

        seekBar.addEventListener('input', () => { seekDragging = true; });
        seekBar.addEventListener('change', () => {
            seekDragging = false;
            const duration = video.duration || 0;
            const time = (seekBar.value / 100) * duration;
            remoteAction2Seek(time);
        });

        function remoteAction2Seek(time) {
            if (isSource) {
                applyLocalAction('seek', time);
                broadcastSyncState();
            } else if (conn) {
                conn.send({ type: 'remote-control', action: 'seek', time });
            }
        }

        function updateTimeLabel() {
            const cur = video.currentTime || 0;
            const dur = video.duration || 0;
            if (dur > 0 && !seekDragging) seekBar.value = (cur / dur) * 100;
            timeLabel.innerText = fmt(cur) + " / " + fmt(dur);
        }

        function updateTimeLabelFromRemote(time, duration) {
            if (!seekDragging) seekBar.value = duration > 0 ? (time / duration) * 100 : 0;
            timeLabel.innerText = fmt(time) + " / " + fmt(duration);
        }

        function fmt(sec) {
            if (!isFinite(sec)) return "۰۰:۰۰";
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return m + ":" + s;
        }

        function updateSourceUI() {
            sourceStatus.innerHTML = isSource
                ? '<span class="badge source">صاحب فیلم تو هستی</span>'
                : '<span class="badge">داری فیلم دوستت رو تماشا می‌کنی</span>';
        }

        const playOverlay = document.getElementById('playOverlay');
        const muteBtn = document.getElementById('muteBtn');

        function attemptPlay() {
            const p = video.play();
            if (p && p.catch) {
                p.then(() => {
                    playOverlay.style.display = 'none';
                }).catch(() => {
                    playOverlay.style.display = 'flex';
                });
            }
        }

        function forcePlay() {
            video.play().then(() => {
                playOverlay.style.display = 'none';
            }).catch((err) => {
                debugStatus.innerText = 'خطای پخش: ' + err.name + ' - ' + err.message;
                playOverlay.style.display = 'flex';
            });
        }

        function toggleMute() {
            video.muted = !video.muted;
            updateMuteBtn();
            if (!video.muted) attemptPlay();
        }

        function updateMuteBtn() {
            muteBtn.innerText = video.muted ? '🔇 صدا' : '🔊 صدا';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                (video.requestFullscreen || video.webkitRequestFullscreen || video.msRequestFullscreen)
                    .call(video)
                    .catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        const debugStatus = document.getElementById('debugStatus');
        setInterval(() => {
            let trackInfo = 'ندارد';
            if (video.srcObject) {
                const vTracks = video.srcObject.getVideoTracks();
                const aTracks = video.srcObject.getAudioTracks();
                const vt = vTracks[0];
                const at = aTracks[0];
                trackInfo = `video-track: ${vt ? `state=${vt.readyState},muted=${vt.muted},enabled=${vt.enabled}` : 'ندارد'} | ` +
                            `audio-track: ${at ? `state=${at.readyState},muted=${at.muted},enabled=${at.enabled}` : 'ندارد'}`;
            }
            debugStatus.innerText =
                `resolution: ${video.videoWidth}x${video.videoHeight} | readyState: ${video.readyState} | paused: ${video.paused} | muted: ${video.muted}\n${trackInfo}`;
        }, 1000);
    </script>
</body>
</html>
