<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تماشای فیلم و چت دونفره</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: Tahoma; padding: 20px; }
        video { width: 80%; max-width: 800px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .box { background: #222; padding: 15px; border-radius: 8px; margin: 10px auto; max-width: 800px; }
        #chatBox { height: 120px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: right; margin-bottom: 10px; font-size: 14px; }
        input, button { padding: 8px; border-radius: 5px; border: none; }
        input[type="text"] { width: 70%; }
        button { background: #4f46e5; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h3>مرحله ۱: ارتباط با دوست</h3>
        <p id="myId">شناسه شما: در حال دریافت...</p>
        <input type="text" id="peerIdInput" placeholder="شناسه دوستتان را اینجا وارد کنید">
        <button onclick="connectToPeer()">اتصال به دوست</button>
    </div>

    <div class="box">
        <h3>انتخاب فایل فیلم (فقط میزبان)</h3>
        <input type="file" id="fileInput" accept="video/*">
    </div>

    <video id="videoPlayer" controls></video>

    <div class="box">
        <h3>چت آنلاین</h3>
        <div id="chatBox"></div>
        <input type="text" id="messageInput" placeholder="پیام خود را بنویسید...">
        <button onclick="sendMessage()">ارسال</button>
    </div>

    <!-- کتابخانه PeerJS برای ارتباط P2P بدون سرور اختصاصی -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer();
        let conn;
        const myIdText = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const video = document.getElementById('videoPlayer');

        peer.on('open', (id) => {
            myIdText.innerText = "شناسه شما: " + id + " (این را برای دوستت بفرست)";
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
            appendSystemMessage("دوست شما متصل شد!");
        });

        function connectToPeer() {
            const id = peerIdInput.value.trim();
            if (!id) return;
            conn = peer.connect(id);
            setupConnection();
            appendSystemMessage("به دوستتان متصل شدید!");
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'chat') {
                    appendMessage("دوستت: " + data.text);
                } else if (data.type === 'sync') {
                    isRemoteTrigger = true;
                    if (Math.abs(video.currentTime - data.time) > 1) video.currentTime = data.time;
                    if (data.action === 'play') video.play();
                    if (data.action === 'pause') video.pause();
                    setTimeout(() => isRemoteTrigger = false, 300);
                }
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !conn) return;
            conn.send({ type: 'chat', text: text });
            appendMessage("خودم: " + text);
            messageInput.value = '';
        }

        function appendMessage(text) {
            chatBox.innerHTML += `<div>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            chatBox.innerHTML += `<div style="color: #10b981;">${text}</div>`;
        }

        // انتخاب و پخش فیلم
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            video.src = URL.createObjectURL(file);
        });

        // همگام‌سازی کنترل فیلم
        let isRemoteTrigger = false;
        video.onplay = () => {
            if (isRemoteTrigger || !conn) return;
            conn.send({ type: 'sync', action: 'play', time: video.currentTime });
        };
        video.onpause = () => {
            if (isRemoteTrigger || !conn) return;
            conn.send({ type: 'sync', action: 'pause', time: video.currentTime });
        };
    </script>
</body>
</html>
