<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تماشای فیلم و چت دونفره (P2P)</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: Tahoma; padding: 20px; }
        video { width: 80%; max-width: 800px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .box { background: #222; padding: 15px; border-radius: 8px; margin: 10px auto; max-width: 800px; }
        #chatBox { height: 120px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: right; margin-bottom: 10px; font-size: 14px; }
        input, button { padding: 8px; border-radius: 5px; border: none; font-family: Tahoma; }
        input[type="text"] { width: 60%; }
        button { background: #4f46e5; color: #fff; cursor: pointer; margin: 2px; }
        button:hover { background: #4338ca; }
        .control-btns { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>مرحله ۱: اتصال به دوست</h3>
        <p id="myId">شناسه شما: در حال دریافت از سرور...</p>
        <input type="text" id="peerIdInput" placeholder="شناسه دوستتان را اینجا وارد کنید">
        <button onclick="connectToPeer()">اتصال به دوست</button>
    </div>

    <div class="box">
        <h3>انتخاب فایل فیلم (هر کس فایل خودش را باز کند)</h3>
        <input type="file" id="fileInput" accept="video/*">
        <div class="control-btns">
            <button onclick="skipTime(-5)">⏪ ۵ ثانیه عقب</button>
            <button onclick="skipTime(5)">۵ ثانیه جلو ⏩</button>
        </div>
    </div>

    <video id="videoPlayer" controls></video>

    <div class="box">
        <h3>چت آنلاین</h3>
        <div id="chatBox"></div>
        <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">ارسال</button>
    </div>

    <!-- کتابخانه PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        // استفاده از تنظیمات استاندارد برای پایداری بیشتر اتصال
        const peer = new Peer({
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        let conn;
        const myIdText = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerIdInput');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const video = document.getElementById('videoPlayer');

        peer.on('open', (id) => {
            myIdText.innerText = "شناسه شما: " + id;
        });

        peer.on('error', (err) => {
            appendSystemMessage("خطا در ارتباط با سرور: " + err.type);
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
            appendSystemMessage("دوست شما متصل شد!");
        });

        function connectToPeer() {
            const id = peerIdInput.value.trim();
            if (!id) return;
            appendSystemMessage("در حال اتصال به دوست...");
            conn = peer.connect(id);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                appendSystemMessage("ارتباط موفقیت‌آمیز برقرار شد!");
            });

            conn.on('data', (data) => {
                if (data.type === 'chat') {
                    appendMessage("دوستت: " + data.text);
                } else if (data.type === 'sync') {
                    isRemoteTrigger = true;
                    video.currentTime = data.time;
                    if (data.action === 'play') video.play();
                    if (data.action === 'pause') video.pause();
                    setTimeout(() => isRemoteTrigger = false, 300);
                }
            });

            conn.on('close', () => {
                appendSystemMessage("ارتباط با دوست قطع شد.");
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !conn) return;
            conn.send({ type: 'chat', text: text });
            appendMessage("خودم: " + text);
            messageInput.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(text) {
            chatBox.innerHTML += `<div>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            chatBox.innerHTML += `<div style="color: #10b981; font-weight: bold;">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            video.src = URL.createObjectURL(file);
            appendSystemMessage("فایل ویدیویی روی مرورگر شما بارگذاری شد.");
        });

        function skipTime(seconds) {
            video.currentTime += seconds;
            sendSyncState(video.paused ? 'pause' : 'play');
        }

        function sendSyncState(action) {
            if (!conn) return;
            conn.send({
                type: 'sync',
                action: action,
                time: video.currentTime
            });
        }

        let isRemoteTrigger = false;
        video.onplay = () => {
            if (isRemoteTrigger) return;
            sendSyncState('play');
        };
        video.onpause = () => {
            if (isRemoteTrigger) return;
            sendSyncState('pause');
        };
        video.onseeked = () => {
            if (isRemoteTrigger) return;
            sendSyncState(video.paused ? 'pause' : 'play');
        };
    </script>
</body>
</html>
